# Frontier explorer (moonmapper_nav2). Lastes av autonomous_exploration_full.launch.py
# Publiserer /frontier_explorer/status og /frontier_explorer/current_goal med TRANSIENT_LOCAL
frontier_explorer:
  ros__parameters:
    use_sim_time: true
    map_topic: /map
    map_frame: map
    base_frame: base_footprint
    navigate_action: /navigate_to_pose
    cmd_vel_topic: /cmd_vel_raw
    exploration_rate_hz: 2.0
    min_frontier_cluster_size: 5
    min_goal_distance: 0.8
    min_goal_distance_m: 0.8
    preferred_goal_distance_m: 1.5
    max_goal_distance: 6.0
    max_goal_distance_m: 6.0
    max_goal_distance_stage_m: 6.0
    goal_timeout_sec: 120.0
    occupied_threshold: 65
    free_threshold: 0
    unknown_value: -1
    unknown_as_blocked_in_planner_grid: true
    goal_inflation_radius_m: 0.15
    bfs_goal_inflation_radius_m: 0.10
    approach_search_radius_min_m: 0.2
    approach_search_radius_max_m: 2.0
    allow_frontier_adjacent_unknown: true
    require_strict_reachability_for_goal: false
    require_passable_for_approach: false
    frontier_neighbor_fallback_m: 1.0
    min_occupied_clearance_m: 0.15
    min_obstacle_clearance_m: 0.28
    min_obstacle_clearance_floor_m: 0.24
    preferred_obstacle_clearance_m: 0.50
    min_unknown_clearance_m: 0.10
    preferred_unknown_clearance_m: 0.25
    frontier_goal_score_obstacle_weight: 3.0
    frontier_goal_score_distance_weight: 1.0
    frontier_goal_score_cluster_weight: 1.5
    frontier_goal_score_unknown_weight: 1.0
    min_free_space_around_goal_m: 0.45
    avoid_corner_goals: true
    corner_penalty: 5.0
    corner_check_radius_m: 0.5
    publish_debug_markers: false
    enable_map_debug_log: false
    blacklist_failed_goal_radius_m: 0.6
    blacklist_failed_cluster: true
    min_clearance_after_failure_m: 0.55
    failure_retry_delay_sec: 0.5
    stuck_blocked_cancel_sec: 2.5
    min_reachable_cells_for_bfs: 120
    retreat_from_frontier_steps: 3
    blacklist_radius: 0.6
    blacklist_radius_m: 0.6
    blacklist_timeout_sec: 60.0
    blacklist_duration_sec: 60.0
    distance_weight: 1.0
    size_weight: 0.03
    publish_markers: true
    start_delay_sec: 5.0
    nav2_ready_timeout_sec: 120.0
    nav2_action_wait_sec: 2.0
    nav2_debug_log_interval_sec: 2.0
    wait_for_nav2: true
    require_nav_lifecycle_active: true
    require_cmd_vel_subscriber: true
    require_map_publisher_for_ready: false
    wait_log_interval_sec: 12.0
    integrated_initial_spin: true
    initial_spin_min_duration_sec: 1.5
    initial_spin_max_duration_sec: 40.0
    initial_spin_angular_z: 0.28
    initial_spin_target_rad: 6.28
    initial_spin_direct_cmd_vel: true
    initial_spin_cmd_vel_topic: /cmd_vel
    map_settle_after_spin_sec: 0.5
    explore_immediately_after_spin: true
    bfs_bridge_known_free_radius_m: 2.5
    nearest_seed_search_radius_m: 0.6
    bfs_seed_search_radius_m: 3.0
    bfs_seed_search_step_m: 0.25
    allow_robot_seed_clearing: true
    robot_seed_clear_radius_m: 0.35
    retry_when_no_frontier: true
    no_frontier_retry_delay_sec: 1.0
    max_no_frontier_retries: 0
    enable_staging_goal: false
    consecutive_fail_limit: 3
    recovery_pause_sec: 1.0
    max_rescan_cycles: 8
    fallback_radius_min_m: 0.15
    fallback_radius_max_m: 0.8
    explored_mark_radius_m: 0.45
    min_passage_clearance_m: 0.46
    min_passage_clearance_floor_m: 0.40
    narrow_passage_penalty_weight: 2.0
    explored_revisit_penalty: 2.5
    enable_return_home_on_complete: true
    return_home_enabled: true
    return_home_on_completion: true
    max_unknown_fraction_complete: 0.08
    reachable_unknown_threshold_ratio: 0.08
    min_frontier_clusters_to_continue: 1
    enable_active_backout_on_failure: false
    backout_duration_sec: 1.2
    backout_speed_mps: 0.10
    home_goal_tolerance_m: 0.35
    return_home_goal_tolerance_m: 0.35
    return_home_yaw_tolerance_rad: 0.6
    return_home_retry_tolerance_m: 0.5
    # Raskere målvalg, kortere pauser mellom forsok
    decision_timeout_sec: 3.0
    max_search_attempts_before_recovery: 3
    allow_relaxed_goal_after_attempts: 2
    goal_reselect_cooldown_sec: 1.0
    min_pause_after_success_sec: 1.0
    min_nav_commit_sec: 2.0
    min_time_between_goal_picks_sec: 1.0
    min_travel_after_goal_m: 0.25
    max_clusters_to_score: 25
    # Recovery når ingen mål funnet
    enable_recovery_maneuvers: true
    recovery_spin_angle_deg: 160.0
    recovery_forward_distance_m: 0.35
    recovery_backup_distance_m: 0.20
    recovery_turn_angle_deg: 45.0
    recovery_cmd_vel_linear: 0.05
    recovery_cmd_vel_angular: 0.25
    max_recovery_cycles: 5
    # siter still under Nav2
    enable_nav_stuck_detection: false
    stuck_blocked_cancel_sec: 12.0
    stuck_timeout_sec: 45.0
    min_progress_m: 0.03
    min_yaw_progress_rad: 0.08
    max_same_goal_failures: 2
    # Fullføring og retur til startposisjon 
    completion_check_enabled: true
    completion_no_frontier_attempts: 5
    min_exploration_time_sec: 30.0
    enable_too_close_recovery: false
    too_close_distance_m: 0.20
    too_close_sustain_sec: 5.0
    too_close_min_progress_m: 0.03
    recovery_backup_distance_m: 0.30
    backup_timeout_sec: 5.0
    enable_no_turn_recovery: false
    no_turn_timeout_sec: 10.0
    recovery_blacklist_radius_m: 0.6
    max_search_attempts_before_recovery: 5
