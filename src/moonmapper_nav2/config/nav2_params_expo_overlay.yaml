# Overlay for world_preset expo_20x20 — høyere fart + skarpere svinger.
controller_server:
  ros__parameters:
    FollowPath:
      vx_max: 0.38
      vx_min: -0.12
      vx_std: 0.28
      wz_max: 1.0
      wz_std: 0.62
      ax_max: 0.55
      az_max: 1.2
      PreferForwardCritic:
        enabled: true
        cost_weight: 7.0
        threshold_to_consider: 0.5
      GoalAngleCritic:
        enabled: true
        cost_weight: 3.5
        threshold_to_consider: 0.7
      PathAngleCritic:
        enabled: true
        cost_weight: 4.5
        threshold_to_consider: 0.55
      PathFollowCritic:
        cost_weight: 11.0
        threshold_to_consider: 1.4
    general_goal_checker:
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 0.75

velocity_smoother:
  ros__parameters:
    max_velocity: [0.40, 0.0, 1.0]
    min_velocity: [-0.14, 0.0, -1.0]
    max_accel: [0.55, 0.0, 1.5]
    max_decel: [-0.70, 0.0, -1.8]

local_costmap:
  local_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.42
