# Overlay for world_preset expo_20x20 — MPPI prioriterer fremoverkjøring.
controller_server:
  ros__parameters:
    FollowPath:
      PreferForwardCritic:
        enabled: true
        cost_weight: 16.0
        threshold_to_consider: 0.4
      GoalAngleCritic:
        enabled: false
      PathAngleCritic:
        enabled: false
      PathFollowCritic:
        cost_weight: 14.0
        threshold_to_consider: 1.5
    general_goal_checker:
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 3.14

local_costmap:
  local_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.45
